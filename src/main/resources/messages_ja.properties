assistant.local.help=筋肉部位別の種目、週間メニュー、フォーム、重量・回数、回復、栄養についてサポートできます。目標、経験、器具、時間を教えてください。
assistant.local.chest=胸の種目例：ダンベル／バーベルベンチプレス、腕立て伏せ、インクラインプレス、チェストフライ。2～3種目を選び、各3セット×6～12回、あと2～3回できる余裕を残します。
assistant.local.back=背中の種目例：懸垂／ラットプルダウン、ワンハンドロウ、シーテッドロウ、ルーマニアンデッドリフト。3～4種目を選び、反動を使わず丁寧に行います。
assistant.local.legs=脚メニュー例：スクワット、ルーマニアンデッドリフト、ブルガリアンスクワット、ヒップスラスト、カーフレイズ。まずは制御できる重量で3セット×8～12回。
assistant.local.shoulders=肩の種目例：オーバーヘッドプレス、サイドレイズ、リアデルトフライ、フェイスプル。中部・後部は反動なしの10～20回が適しています。
assistant.local.load=身長と体重だけで安全な重量を正確に決めることはできません。正しいフォームで8～12回行い、あと2～3回できる重量（RIR 2～3）から始めます。全セットが楽なら次回1～2kg／片手、または2.5～5%増やします。
assistant.local.schedule=週3回の例：月曜Push（胸・肩・三頭）、水曜Pull（背中・二頭）、金曜Legs/Core。1回4～6種目、各3セット程度で、強い刺激の間に休養日を入れます。日数、器具、目標を教えると調整できます。
