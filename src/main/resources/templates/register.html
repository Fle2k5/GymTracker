<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{auth.register.title}">Register</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-shell"><nav class="language-switcher auth-languages" role="group" th:attr="aria-label=#{app.language}"><a th:href="@{/register(lang='vi')}" th:classappend="${#locale.language == 'vi'} ? 'active' : ''">VI</a><a th:href="@{/register(lang='en')}" th:classappend="${#locale.language == 'en'} ? 'active' : ''">EN</a><a th:href="@{/register(lang='ja')}" th:classappend="${#locale.language == 'ja'} ? 'active' : ''">日本語</a></nav><section class="auth-card">
<p class="eyebrow">GYM TRACKER</p><h1 th:text="#{auth.register.title}">Register</h1><p class="card-copy" th:text="#{auth.register.description}">Create account</p><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form method="post" th:action="@{/register}" class="auth-form"><label><span th:text="#{auth.name}">Name</span><input name="displayName" th:value="${displayName}" minlength="2" maxlength="80" autocomplete="name" required autofocus></label><label><span th:text="#{auth.email}">Email</span><input type="email" name="email" th:value="${email}" maxlength="190" autocomplete="email" required></label><label><span th:text="#{auth.password}">Password</span><input type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><label><span th:text="#{auth.passwordConfirm}">Confirm</span><input type="password" name="passwordConfirm" minlength="8" maxlength="72" autocomplete="new-password" required></label><details><summary th:text="#{auth.legacy.summary}">Old local data</summary><label><span th:text="#{auth.legacy.token}">Claim token</span><input type="password" name="legacyClaimToken" maxlength="200" autocomplete="off"></label><small th:text="#{auth.legacy.help}">Only when upgrading.</small></details><button class="button primary" type="submit" th:text="#{auth.register.submit}">Register</button></form>
<p class="auth-switch"><span th:text="#{auth.hasAccount}">Already registered?</span> <a th:href="@{/login}" th:text="#{auth.login.link}">Login</a></p>
</section></main></body></html>
