assistant.exercise.list=Current exercises:
assistant.local.help=I can help with muscle-group exercises, weekly plans, technique, weight/reps, recovery, and nutrition. Tell me your goal, experience, equipment, and available time.
assistant.local.chest=Chest options include Dumbbell/Barbell Bench Press, Push-up, Incline Press, and Chest Fly. Pick 2–3 exercises for 3 sets of 6–12 reps, stopping with about 2–3 reps in reserve.
assistant.local.back=Back options include Pull-up/Lat Pulldown, One-arm Row, Seated Row, and Romanian Deadlift. Pick 3–4 exercises and prioritize controlled form instead of momentum.
assistant.local.legs=A leg session can include Squat, Romanian Deadlift, Split Squat, Hip Thrust, and Calf Raise. Begin with 3 sets of 8–12 controlled reps.
assistant.local.shoulders=Shoulder options include Overhead Press, Lateral Raise, Rear-delt Fly, and Face Pull. Side/rear delts often respond well to 10–20 controlled reps without swinging.
assistant.local.load=Height and body weight alone cannot determine a safe exact load. Start with a weight you can perform for 8–12 clean reps while keeping 2–3 reps in reserve (RIR 2–3). When every set is comfortable, add 1–2 kg per dumbbell or 2.5–5% next time.
assistant.local.schedule=Sample 3-day plan: Monday Push, Wednesday Pull, Friday Legs/Core. Use 4–6 exercises per session, about 3 sets each, with at least one recovery day between hard sessions. Tell me your days, equipment, and goal for a more personal plan.
