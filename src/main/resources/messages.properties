assistant.exercise.empty=Hiện chưa có bài tập nào.
assistant.exercise.list=Danh sách bài tập hiện tại:
assistant.local.help=Mình có thể đồng hành về bài tập theo nhóm cơ, lịch tuần, kỹ thuật, mức tạ/reps, phục hồi và dinh dưỡng. Hãy hỏi cụ thể mục tiêu, kinh nghiệm, dụng cụ và thời gian bạn có.
assistant.local.chest=Nhóm ngực có thể tập: Dumbbell/Barbell Bench Press, Push-up, Incline Press và Chest Fly. Chọn 2–3 bài, mỗi bài 3 hiệp × 6–12 reps; dừng khi còn khoảng 2–3 reps dự trữ.
assistant.local.back=Nhóm lưng có thể tập: Pull-up/Lat Pulldown, One-arm Row, Seated Row và Romanian Deadlift. Chọn 3–4 bài, ưu tiên kỹ thuật và kéo bằng khuỷu tay thay vì giật người.
assistant.local.legs=Buổi chân có thể gồm Squat, Romanian Deadlift, Split Squat, Hip Thrust và Calf Raise. Bắt đầu 3 hiệp × 8–12 reps với mức tạ kiểm soát được.
assistant.local.shoulders=Nhóm vai có thể tập Overhead Press, Lateral Raise, Rear-delt Fly và Face Pull. Vai giữa/sau thường hợp 10–20 reps với chuyển động chậm và không nhún người.
assistant.local.load=Không thể chọn chính xác số kg chỉ từ chiều cao và cân nặng. Hãy bắt đầu với mức tạ bạn làm được 8–12 reps đúng kỹ thuật và vẫn còn 2–3 reps dự trữ (RIR 2–3). Nếu hoàn thành mọi hiệp dễ dàng, tăng 1–2 kg mỗi tay hoặc 2,5–5% ở buổi sau.
assistant.local.schedule=Lịch 3 buổi tham khảo: Thứ 2 Push (ngực–vai–tay sau), Thứ 4 Pull (lưng–tay trước), Thứ 6 Legs/Core. Mỗi buổi 4–6 bài, 3 hiệp/bài, có ít nhất 1 ngày nghỉ giữa các nhóm cơ nặng. Cho mình biết số ngày, dụng cụ và mục tiêu để cá nhân hóa thêm.
