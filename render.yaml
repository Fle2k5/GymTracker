services:
  - type: web
    name: gym-tracker-web
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgresql
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC
